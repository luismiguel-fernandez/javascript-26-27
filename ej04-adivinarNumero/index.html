<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer type="text/javascript" src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script defer type="text/javascript" src="bootstrap.js"></script>
    <link rel="stylesheet" href="bootstrap.css">
</head>
<body>
    <h1>Juego de Adivinar el Número</h1>
    <p>Intenta adivinar el número entre 1 y 100</p>
    <input type="number" id="guess" min="1" max="100" placeholder="Introduce tu número" />
    <button id="submitBtn">Adivinar</button>
    <p id="attempts">Intentos restantes: 6</p>
    <p class="message" id="message"></p>
</body>
</html>
